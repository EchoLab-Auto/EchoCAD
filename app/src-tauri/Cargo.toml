[package]
name = "echicad-app"
version.workspace = true
description = "EchoCAD Tauri application"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["unstable"] }
tauri-plugin-log = { workspace = true }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { workspace = true }
serde_json = { workspace = true }
echi-core = { path = "../../crates/echi-core" }
echi-geom = { path = "../../crates/echi-geom" }
echi-render = { path = "../../crates/echi-render" }
echi-wgpu = { path = "../../crates/echi-wgpu" }
echi-io = { path = "../../crates/echi-io" }
echi-plugin = { path = "../../crates/echi-plugin" }
echi-plugin-gear = { path = "../../crates/echi-plugin-gear" }
echi-plugin-cycloidal = { path = "../../crates/echi-plugin-cycloidal" }
log = { workspace = true }
raw-window-handle = "0.6"
cadrum = { version = "0.8", optional = true }

[features]
# Native wgpu viewport is the only rendering mode now.
default = []
brep = ["echi-render/brep"]
occt = ["echi-render/occt", "cadrum"]
